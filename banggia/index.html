<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bảng giá sản phẩm</title>
<style>
*{box-sizing:border-box}body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#17212f;background:#fff;margin:0}main{max-width:1100px;margin:24px auto;padding:0 15px}h1{font-size:21px;margin:0 0 18px}input{width:100%;border:1px solid #d5dce5;border-radius:8px;padding:11px 13px;font:inherit;margin-bottom:15px}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #e8ecf0;padding:11px 8px;text-align:left;vertical-align:top}th{background:#f7f9fc;font-size:13px}td.price{font-weight:700;white-space:nowrap}#msg{color:#64748b} .mobile-name{display:none}@media(max-width:600px){main{margin:12px auto}h1{font-size:19px}th,td{padding:10px 5px;font-size:13px}td.price{white-space:normal;min-width:90px}}
</style></head><body><main><h1>Bảng giá sản phẩm</h1><input id="search" type="search" placeholder="Tìm tên sản phẩm…" aria-label="Tìm sản phẩm"><div id="msg">Đang tải bảng giá…</div><table id="table" hidden><thead><tr><th>Tên sản phẩm</th><th>Giá bán</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>
const rows=document.getElementById('rows'),msg=document.getElementById('msg'),table=document.getElementById('table'),search=document.getElementById('search');let items=[];
function draw(){const q=search.value.trim().toLocaleLowerCase('vi');rows.replaceChildren();let count=0;for(const p of items){if(q&&!(p.ten||'').toLocaleLowerCase('vi').includes(q))continue;const tr=document.createElement('tr');for(const [v,cls] of [[p.ten||'',''],[p.gia||'','price']]){const td=document.createElement('td');td.textContent=v;td.className=cls;tr.append(td)}rows.append(tr);count++}table.hidden=count===0;msg.textContent=count?'':(items.length?'Không tìm thấy sản phẩm.':'Chưa có bảng giá được công bố.')}
search.addEventListener('input',draw);
// Read the latest published file from GitHub rather than a possibly stale GitHub Pages deployment.
async function loadPrices(){
 const stamp=Date.now();
 const sources=[
   'https://raw.githubusercontent.com/AdamAvaAdam/banhang123/main/banggia/data.json?t='+stamp,
   './data.json?t='+stamp
 ];
 let lastError;
 for(const url of sources){
   try{
     const response=await fetch(url,{cache:'no-store'});
     if(!response.ok)throw Error('HTTP '+response.status);
     const data=await response.json();
     if(!Array.isArray(data.items))throw Error('Dữ liệu không hợp lệ');
     items=data.items.filter(p=>p&&typeof p.ten==='string'&&typeof p.gia==='string').map(p=>({ten:p.ten,gia:p.gia}));
     draw();return;
   }catch(error){lastError=error}
 }
 if(!items.length){msg.textContent='Không thể tải bảng giá. Vui lòng thử lại sau.';table.hidden=true}
}
loadPrices();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadPrices()});
setInterval(loadPrices,60000);
</script></body></html>
